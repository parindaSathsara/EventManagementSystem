# =============================================================================
# Stage website  →  Next.js (pm2: events-web) in the workspace container :8012
#
# Same pattern as backend/deploy/nginx/events-api.workspace.conf: nginx runs in
# its own container and reaches the app by container name.
#
# CHANGE `server_name` to the website's real domain, then:
#   1. copy into the nginx container's sites dir (beside events-api)
#   2. nginx -t && nginx -s reload
#   3. point the domain at the server in Cloudflare (proxied, like events-api)
#   4. set WEB_PUBLIC_URL=https://<domain> in backend/deploy/.deploy-config
#
# One-time step — deploys never touch this file.
# =============================================================================
server {
    listen 80;
    listen [::]:80;

    server_name events.aahaas.com;   # ← the website's domain

    # Flyer / avatar uploads from the organizer studio go through the site's
    # /api proxy to the API; keep in step with the API's limit.
    client_max_body_size 200M;
    client_body_timeout  120s;

    # Hashed build assets never change for a given URL — cache hard at the edge.
    location /_next/static/ {
        proxy_pass http://aahaas-workspace-1:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://aahaas-workspace-1:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    error_log  /var/log/nginx/events-web_error.log;
    access_log /var/log/nginx/events-web_access.log;
}
